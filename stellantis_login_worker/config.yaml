name: Stellantis Login Worker
version: 0.1.0
slug: stellantis_login_worker
description: Local OAuth login service for the homeassistant-stellantis-vehicles integration
url: https://github.com/taubenhorst/StellantisHAAddon
arch:
  - aarch64
  - amd64
image: ghcr.io/taubenhorst/stellantis-login-worker-{arch}
init: false
startup: application
boot: manual
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: HTTP API the integration calls (its "Login service URL")
options:
  log_level: info
  timeout: 60
schema:
  log_level: list(debug|info|warning|error)
  timeout: int(30,300)
